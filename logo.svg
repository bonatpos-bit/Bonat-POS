<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B7C8A"/>
      <stop offset="0.55" stop-color="#3E4C58"/>
      <stop offset="1" stop-color="#232A30"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D1D8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E0A800"/>
      <stop offset="1" stop-color="#FFE27A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3945"/>
      <stop offset="1" stop-color="#18222A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <g transform="translate(256 256) scale(1.16) translate(-247.5 -249)">
    <!-- phone riding in the cart -->
    <g transform="rotate(-9 275 200) translate(275 200) scale(1.14) translate(-275 -200)">
      <rect x="232" y="92" width="86" height="172" rx="16" fill="url(#metal)"/>
      <rect x="241" y="108" width="68" height="140" rx="7" fill="url(#screen)"/>
      <rect x="251" y="196" width="12" height="38" rx="3" fill="url(#gold)"/>
      <rect x="269" y="174" width="12" height="60" rx="3" fill="url(#gold)"/>
      <rect x="287" y="148" width="12" height="86" rx="3" fill="url(#gold)"/>
      <circle cx="275" cy="100" r="2.6" fill="#8896A2"/>
      <path d="M252 134 q23 -22 46 0" fill="none" stroke="#FFE27A" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </g>
    <!-- basket -->
    <path d="M160 200 H412 L374 304 H182 Z" fill="#fff" fill-opacity="0.16" stroke="url(#metal)" stroke-width="22" stroke-linejoin="round"/>
    <!-- handle + frame -->
    <path d="M84 146 H146 L186 326 H392" fill="none" stroke="url(#metal)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- wheels -->
    <circle cx="214" cy="386" r="27" fill="url(#metal)"/>
    <circle cx="214" cy="386" r="9" fill="#3E4C58"/>
    <circle cx="354" cy="386" r="27" fill="url(#metal)"/>
    <circle cx="354" cy="386" r="9" fill="#3E4C58"/>
  </g>
</svg>
